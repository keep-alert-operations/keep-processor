name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Let Poetry use the sibling-repository credential instead of GITHUB_TOKEN.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: python -m pip install poetry==2.3.1
      - name: Authenticate private dependencies
        env:
          APPCHI_TOKEN: ${{ secrets.APPCHI_REPOSITORIES_TOKEN }}
        run: |
          test -n "$APPCHI_TOKEN" || { echo 'Configure APPCHI_REPOSITORIES_TOKEN with read access to the Appchi repositories.'; exit 1; }
          git config --global credential.helper '!f() { echo username=x-access-token; echo "password=$APPCHI_TOKEN"; }; f'
      - name: Locked install and checks
        env:
          APPCHI_TOKEN: ${{ secrets.APPCHI_REPOSITORIES_TOKEN }}
        run: |
          poetry check --lock
          poetry sync --all-extras
          poetry run ruff check src tests
          if [ -d tests/unit ]; then poetry run pytest tests/unit -q; fi
          poetry build --format wheel
