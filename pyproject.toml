[project]
name = "keep-processor"
version = "0.1.0"
description = "Kafka source processing, immutable PostgreSQL replay proof and transactional changed-event publication."
requires-python = ">=3.13,<3.14"
dependencies = [
  "keep-domain[runtime] @ git+https://github.com/keep-alert-operations/keep-domain.git@762f122926be82cb0d2e1910ddda382f5ffe1a1b"
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "hypothesis>=6.130,<7", "build>=1,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/unit", "tests/integration"]
markers = ["integration: requires isolated real services", "compatibility: requires configured external services"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[project.scripts]
keep-processor = "keep.processor.main:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.poetry]
requires-poetry = "==2.3.1"
packages = [
  { include = "keep", from = "src" },
]

# Resolve-only pins preserve the coordinated baseline without adding runtime requirements.
[tool.poetry.group.lock-constraints]
optional = true

